server :
  port : 8082

# Spring
spring :
  application :
    name : auth-gateway-service
  datasource : 
    url : jdbc:mysql://127.0.0.1:3306/AuthDB?createDatabaseIfNotExist=true
    driver-class-name : com.mysql.cj.jdbc.Driver
    username : ${DB_USERNAME:root}
    password : ${DB_PASSWORD:password}
  jpa : 
    show-sql : true
    generate-ddl : true
    defer-datasource-initialization : true
    hibernate : 
      ddl-auto : create-drop
    properties : 
      hibernate : 
        format_sql : true
  sql : 
    init : 
      mode : always

#JWT
jwt :
  secret : ${JWT_SECRET:197538927F423K7728472B5L62574553686K88597133743736897A2443268007}
  expiration-ms : ${JWT_EXPIRATION_MS:86400000}

# Eureka
eureka : 
  instance : 
    hostname : localhost
  client : 
    registerWithEureka : true
    fetchRegistry : true
    serviceUrl : 
      defaultZone : http://localhost:8761/eureka


# Actuator
info : 
  app : 
    name : auth-gateway-service
    description : auth-gateway-service Application
    version : 1.0.0
management : 
  endpoint : 
    shutdown : 
      enabled : false
  endpoints : 
    web : 
      exposure : 
        include : health,info
