server.port=8761
spring.application.name=Eureka-Service

info.app.name=Eureka-Service
info.app.description=Eureka-Service Application
info.app.version=1.0.0
management.endpoint.shutdown.enabled=false
management.endpoints.web.exposure.include=health,info

# Distributed Tracing
management.tracing.sampling.probablility=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

eureka.instance.hostname=localhost
eureka.client.registerWithEureka=false
eureka.client.fetchRegistry=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka